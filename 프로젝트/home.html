<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말자막 녹화기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 왼쪽 영상(촬영/재생), 오른쪽 받아쓰기 패널. 좁으면 위아래로 쌓임 */
:root {
  --bg: #eef1f0; --panel: #ffffff; --fg: #1d2523; --muted: #66716e;
  --line: #d5dcda; --accent: #0f7a63; --rec: #d23a3a; --cap-bg: rgba(10,14,13,.72);
  --display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121716; --panel: #1b2220; --fg: #e5ecea; --muted: #94a19d;
    --line: #2d3734; --accent: #3cc3a0; --rec: #ff6161; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--body); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)); display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 400 1.8rem/1.2 var(--display); margin: 0; }
.status { font: 500 .85rem var(--mono); color: var(--muted); display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.status.on .dot { background: var(--rec); animation: blink 1s infinite; }
.status.on { color: var(--rec); }
@keyframes blink { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status.on .dot { animation: none; } }

.main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }

.stage { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9; }
.stage video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
#preview { transform: scaleX(-1); }
.caption { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); max-width: 90%;
  background: var(--cap-bg); color: #fff; padding: 6px 14px; border-radius: 6px;
  font: 600 clamp(.95rem, 2.2vw, 1.35rem)/1.45 var(--body); text-align: center; }
.caption .interim { opacity: .65; }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: #9aa7a3; text-align: center; padding: 16px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
button, select { font: 600 .95rem var(--body); border-radius: 8px; padding: 10px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.rec-btn { background: var(--rec); border-color: var(--rec); color: #fff; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.timer { font: 500 1rem var(--mono); font-variant-numeric: tabular-nums; margin-left: auto; }

aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 320px; max-height: 78vh; }
aside h2 { font: 400 1.2rem var(--display); margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
aside h2 small { font: .8rem var(--body); color: var(--muted); }
.lines { flex: 1; overflow-y: auto; padding: 8px 8px; margin: 0; list-style: none; }
.lines li { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; }
.lines li:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.lines li.active { background: color-mix(in srgb, var(--accent) 18%, transparent); }
.lines time { font: 500 .8rem/1.9 var(--mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 16px; }
.tools { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.tools button { padding: 8px 12px; font-size: .85rem; }
.note { color: var(--muted); font-size: .85rem; margin: 0; }
.err { color: var(--rec); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>말자막 녹화기</h1>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">대기 중</span></div>
  </header>

  <div class="main">
    <section>
      <div class="stage">
        <video id="preview" autoplay muted playsinline></video>
        <video id="playback" controls playsinline hidden></video>
        <div class="placeholder" id="placeholder">‘카메라 켜기’를 누르면 화면이 여기에 나타납니다.</div>
        <div class="caption" id="caption" hidden></div>
      </div>
      <div class="controls">
        <button id="camBtn" class="primary">카메라 켜기</button>
        <button id="recBtn" class="rec-btn" disabled>● 녹화 시작</button>
        <button id="stopBtn" disabled>■ 녹화 끝내기</button>
        <label for="lang" class="note">언어</label>
        <select id="lang">
          <option value="ko-KR">한국어</option>
          <option value="en-US">English</option>
          <option value="ja-JP">日本語</option>
          <option value="zh-CN">中文</option>
        </select>
        <span class="timer" id="timer">00:00</span>
      </div>
      <p class="note" id="msg" style="margin-top:10px">Chrome 또는 Edge에서 사용하세요. 음성 인식은 브라우저의 온라인 음성 서비스를 사용하므로 인터넷 연결이 필요합니다.</p>
    </section>

    <aside>
      <h2>받아쓴 내용 <small id="count"></small></h2>
      <ul class="lines" id="lines"><li class="empty" style="display:block;cursor:default">녹화를 마치면 말한 내용이 시간과 함께 여기에 정리됩니다. 줄을 누르면 그 장면으로 이동합니다.</li></ul>
      <div class="tools">
        <button id="copyBtn" disabled>텍스트 복사</button>
        <button id="txtBtn" disabled>텍스트 저장 (.txt)</button>
        <button id="srtBtn" disabled>자막 저장 (.srt)</button>
        <button id="vidBtn" disabled>영상 저장</button>
      </div>
    </aside>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const preview = $('preview'), playback = $('playback'), caption = $('caption');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let stream = null, recorder = null, chunks = [], videoBlob = null, videoURL = null;
let recognition = null, recording = false, startTime = 0, timerId = null;
let segments = [];            // {start, end, text}
let segStart = null;          // 현재 문장이 시작된 시각(초)

const fmt = s => { s = Math.max(0, s); const m = Math.floor(s/60), r = Math.floor(s%60);
  return String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0'); };
const now = () => (performance.now() - startTime) / 1000;
const msg = (t, isErr) => { $('msg').textContent = t; $('msg').className = 'note' + (isErr ? ' err' : ''); };

if (!SR) msg('이 브라우저는 음성 인식을 지원하지 않습니다. Chrome이나 Edge로 열어 주세요.', true);

$('camBtn').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true });
    preview.srcObject = stream;
    preview.hidden = false; playback.hidden = true;
    $('placeholder').hidden = true;
    $('recBtn').disabled = !SR ? true : false;
    $('camBtn').disabled = true;
    msg('준비됐습니다. ‘녹화 시작’을 누르고 말해 보세요.');
  } catch (e) {
    msg('카메라나 마이크를 쓸 수 없습니다. 주소창 왼쪽의 권한 설정에서 허용해 주세요. (' + e.name + ')', true);
  }
};

function startRecognition() {
  recognition = new SR();
  recognition.lang = $('lang').value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i], text = r[0].transcript.trim();
      if (segStart === null && text) segStart = Math.max(0, now() - 0.8);
      if (r.isFinal) {
        if (text) segments.push({ start: segStart ?? now(), end: now(), text });
        segStart = null;
      } else interim += text + ' ';
    }
    const last = segments.length ? segments[segments.length - 1].text : '';
    caption.innerHTML = '';
    const span = document.createElement('span');
    if (interim.trim()) { span.className = 'interim'; span.textContent = interim.trim(); }
    else span.textContent = last;
    caption.appendChild(span);
    caption.hidden = !span.textContent;
  };
  recognition.onerror = e => {
    if (e.error === 'not-allowed') msg('마이크 권한이 거부되었습니다.', true);
    else if (e.error === 'network') msg('음성 인식 서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.', true);
  };
  // 크롬은 말이 멈추면 인식을 스스로 끝내므로, 녹화 중이면 다시 시작
  recognition.onend = () => { if (recording) { try { recognition.start(); } catch (_) {} } };
  recognition.start();
}

$('recBtn').onclick = () => {
  segments = []; segStart = null; chunks = [];
  if (videoURL) URL.revokeObjectURL(videoURL);
  const type = ['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = finish;
  recorder.start(1000);
  recording = true; startTime = performance.now();
  startRecognition();
  timerId = setInterval(() => $('timer').textContent = fmt(now()), 250);
  $('status').classList.add('on'); $('statusText').textContent = '녹화 중';
  $('recBtn').disabled = true; $('stopBtn').disabled = false; $('lang').disabled = true;
  preview.hidden = false; playback.hidden = true;
  msg('녹화 중입니다. 말하면 화면 아래에 자막이 나타납니다.');
};

$('stopBtn').onclick = () => {
  recording = false;
  clearInterval(timerId);
  try { recognition.stop(); } catch (_) {}
  recorder.stop();
  $('stopBtn').disabled = true;
  $('status').classList.remove('on'); $('statusText').textContent = '정리 중…';
};

function finish() {
  // 인식이 마지막 문장을 늦게 돌려주는 경우를 위해 잠깐 기다림
  setTimeout(() => {
    videoBlob = new Blob(chunks, { type: recorder.mimeType || 'video/webm' });
    videoURL = URL.createObjectURL(videoBlob);
    playback.src = videoURL;
    preview.hidden = true; playback.hidden = false; caption.hidden = true;
    renderLines();
    $('statusText').textContent = '녹화 완료 · ' + fmt(now());
    $('recBtn').disabled = false; $('recBtn').textContent = '● 다시 녹화'; $('lang').disabled = false;
    ['copyBtn','txtBtn','srtBtn','vidBtn'].forEach(id => $(id).disabled = false);
    msg(segments.length ? '받아쓴 내용이 오른쪽에 정리됐습니다.' : '인식된 말이 없습니다. 마이크 소리를 확인해 주세요.', !segments.length);
  }, 700);
}

function renderLines() {
  const ul = $('lines'); ul.innerHTML = '';
  $('count').textContent = segments.length ? segments.length + '문장' : '';
  if (!segments.length) { ul.innerHTML = '<li class="empty" style="display:block;cursor:default">인식된 말이 없습니다.</li>'; return; }
  segments.forEach((s, i) => {
    const li = document.createElement('li'); li.tabIndex = 0; li.dataset.i = i;
    const t = document.createElement('time'); t.textContent = fmt(s.start);
    const p = document.createElement('span'); p.textContent = s.text;
    li.append(t, p);
    li.onclick = li.onkeydown = e => { if (e.type === 'keydown' && e.key !== 'Enter') return;
      playback.currentTime = s.start; playback.play(); };
    ul.appendChild(li);
  });
}

// 재생 중인 위치의 문장을 오른쪽에서 강조
playback.ontimeupdate = () => {
  const t = playback.currentTime;
  document.querySelectorAll('.lines li[data-i]').forEach(li => {
    const s = segments[li.dataset.i];
    const on = t >= s.start && t < s.end + 0.3;
    if (on && !li.classList.contains('active')) li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    li.classList.toggle('active', on);
  });
};

const plain = () => segments.map(s => `[${fmt(s.start)}] ${s.text}`).join('\n');
const srtTime = s => { const ms = Math.round(s*1000), h = Math.floor(ms/3600000), m = Math.floor(ms%3600000/60000),
  sec = Math.floor(ms%60000/1000), r = ms%1000;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(r).padStart(3,'0')}`; };
const srt = () => segments.map((s, i) => `${i+1}\n${srtTime(s.start)} --> ${srtTime(Math.max(s.end, s.start+1))}\n${s.text}\n`).join('\n');
const stamp = () => new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
function save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(plain()); msg('텍스트를 복사했습니다.'); }
  catch { msg('복사하지 못했습니다. 텍스트 저장을 이용해 주세요.', true); }
};
$('txtBtn').onclick = () => save(new Blob([plain()], { type: 'text/plain;charset=utf-8' }), `받아쓰기-${stamp()}.txt`);
$('srtBtn').onclick = () => save(new Blob([srt()], { type: 'text/plain;charset=utf-8' }), `자막-${stamp()}.srt`);
$('vidBtn').onclick = () => save(videoBlob, `녹화-${stamp()}.${videoBlob.type.includes('mp4') ? 'mp4' : 'webm'}`);
</script>
</body>
</html>
